plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.pina_i'
version = '0.1.0'

android {
  namespace "io.github.pina_i.openmls"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // scripts/build-native-mls.mjs: the Rust library per ABI, and the Kotlin uniffi generated for it.
  sourceSets {
    main {
      java.srcDirs += "generated/kotlin"
      jniLibs.srcDirs += "generated/jniLibs"
    }
  }
}

dependencies {
  // uniffi's Kotlin reaches the library through JNA.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
}
