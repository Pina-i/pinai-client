[package]
name    = "uniffi-bindgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "uniffi's bindings generator, at openmls-native's uniffi version."

[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
