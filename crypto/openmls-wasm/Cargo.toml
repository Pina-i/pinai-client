[package]
name    = "openmls-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Pina'i WASM bundle around openmls — minimum surface needed by the web client (KeyPackage, MlsGroup ops, Welcome handling, application encrypt/decrypt, secret export)."

# Two crate types so the same source can be wasm-pack-built (cdylib) and
# unit-tested on the native host (rlib). Tests compile against the rlib.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys       = "0.3"

# Pinned so a minor openmls bump never silently changes the wrapper's
# behaviour. Treat upgrades as deliberate work — see the implementation
# plan's "Risks / decisions still open" section.
openmls                  = { version = "=0.8.1", features = ["js"] }
openmls_traits           = { version = "=0.5.0" }
openmls_rust_crypto      = { version = "=0.5.1" }
openmls_basic_credential = { version = "=0.5.0" }
tls_codec                = { version = "=0.4.2" }

# Better panic messages in dev. Cheap; we keep it always-on for now —
# Phase 4b can flip it off behind a release-only flag if WASM size becomes
# a problem (the plan budgets 1–3 MiB which already swallows it).
console_error_panic_hook = { version = "0.1", optional = true }

# openmls_rust_crypto + openmls_basic_credential transitively need a JS-shim
# of `getrandom` for randomness in the browser. Forcing the `js` feature
# here makes that work — without it, the build fails with a "no global
# getrandom backend" link error.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Disable wasm-opt — earlier release builds exhibited a pathology where
# `SignatureKeyPair`'s `signature_scheme` and `public/private` Vec<u8>
# fields were observed reading zero bytes from inside browser WASM
# (jsdom + native cargo test were unaffected). Disabling wasm-opt lets
# the wasm-bindgen output reach the browser unchanged. We can revisit
# once we've isolated which optimizer pass is the culprit.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
