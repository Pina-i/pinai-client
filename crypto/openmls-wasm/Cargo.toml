[package]
name    = "openmls-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Pina'i WASM bundle around openmls — minimum surface needed by the web client (KeyPackage, MlsGroup ops, Welcome handling, application encrypt/decrypt, secret export) and the HPKE key shares are sealed with."

# Two crate types so the same source can be wasm-pack-built (cdylib) and
# unit-tested on the native host (rlib). Tests compile against the rlib.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys       = { workspace = true }
openmls                  = { workspace = true, features = ["js"] }
openmls_traits           = { workspace = true }
openmls_rust_crypto      = { workspace = true }
openmls_basic_credential = { workspace = true }
tls_codec                = { workspace = true }
zeroize                  = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
# openmls_rust_crypto + openmls_basic_credential transitively need a JS-shim
# of `getrandom` for randomness in the browser.
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

# Disable wasm-opt — earlier release builds exhibited a pathology where
# `SignatureKeyPair`'s `signature_scheme` and `public/private` Vec<u8>
# fields were observed reading zero bytes from inside browser WASM
# (jsdom + native cargo test were unaffected). Disabling wasm-opt lets
# the wasm-bindgen output reach the browser unchanged. We can revisit
# once we've isolated which optimizer pass is the culprit.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
