packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # electron-builder's Squirrel.Windows tooling: the installers are NSIS, so it never runs.
  electron-winstaller: false
  # msgpackr ships an optional native accelerator for Node. Everything here runs
  # in a browser, where msgpackr uses its JavaScript path regardless, so the
  # build is declined rather than approved — it would add a toolchain
  # requirement for no effect.
  msgpackr-extract: false
