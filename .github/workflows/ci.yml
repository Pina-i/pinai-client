name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A newer push waits for the run under way rather than racing it: edge is always main's latest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain of docker/Dockerfile's wasm stage.
  RUSTUP_TOOLCHAIN: "1.98.1"
  IMAGE: ghcr.io/pina-i/pinai-web

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check-readme-compose.sh
      # On every run, not only tags: a release PR opening a minor fails until compose names it.
      - name: Check the version against the tag and compose's default image
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: sh scripts/check-release-version.sh "$TAG"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      # Saved from main only: another ref's cache would evict main's, which every run reads.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crypto/openmls-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack@0.15.0
      # Before the install, which links crypto/openmls-pkg; the scripts below then find it current.
      - run: node scripts/build-wasm.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @pinai/desktop build
        env:
          # GIFs in the desktop app only with a key; the web image reads its own at run time.
          VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
      # Built at base "/", not the "./" electron-vite's preset forces: a reload two levels deep
      # under app:// would get index.html for its assets. An upgrade could undo the override.
      - run: grep -q 'src="/assets/' apps/desktop/out/renderer/index.html
      # The app's code, built once with the WASM engine: each system's job only packages it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-out
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 3
      - run: cargo test --locked --manifest-path crypto/openmls-wasm/Cargo.toml

  # One runner builds both platforms: the files are built once, and arm64's last stage only
  # copies them (docker/Dockerfile). Pull requests only build.
  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # main: edge and sha-<short>. A tag: 0.1.0, 0.1 and latest; a release candidate
      # (v0.2.0-rc.1) only its own version.
      # GitHub detects the license as AGPL-3.0, which can't say "or later": named here.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: org.opencontainers.image.licenses=AGPL-3.0-or-later
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ github.event_name != 'pull_request' }}
          # Written from main only; pull requests and tags read main's.
          cache-from: type=gha,scope=web
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=web,mode=max' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Each system's installers on its own runner. Pull requests package Linux x64 only; main and
  # tags all four, kept 3 days to try them, and a tag hands them to the release.
  desktop:
    name: desktop (${{ matrix.name }})
    needs: check
    # A hung hdiutil on the macOS runners would otherwise hold the job for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"runner":"ubuntu-24.04","name":"linux-x64","args":"--linux --x64"}]' || '[{"runner":"ubuntu-24.04","name":"linux-x64","args":"--linux --x64"},{"runner":"ubuntu-24.04-arm","name":"linux-arm64","args":"--linux --arm64"},{"runner":"windows-latest","name":"windows-x64","args":"--win --x64"},{"runner":"macos-15","name":"mac-universal","args":"--mac --universal"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The desktop app's packages only: the WASM engine comes built, inside out/.
      - run: pnpm install --frozen-lockfile --filter @pinai/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-out
          path: apps/desktop/out
      - run: pnpm --filter @pinai/desktop package ${{ matrix.args }}
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/dist/mac-universal/Pinai.app
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          # The installers and their blockmaps all start with Pinai (electron-builder.yml's
          # artifactName); the unpacked folders and the builder's own files don't.
          path: |
            apps/desktop/dist/Pinai*
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
          # The installers are compressed already.
          compression-level: 0
          retention-days: 3

  # Published last, once the image and the installers exist: release-please's draft, or for a
  # tag pushed by hand, a new release.
  release:
    needs: [image, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(installers/*)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME" "${prerelease[@]}"
          fi
