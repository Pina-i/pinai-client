name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A newer push waits for the run under way rather than racing it: edge is always main's latest.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/pina-i/pinai-web

jobs:
  # One runner builds both platforms: the files are built once, and arm64's last stage only
  # copies them (docker/Dockerfile). Pull requests only build.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check-readme-compose.sh
      - name: Check the tag against the app version and compose's default image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version apps/web/package.json)
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME, but apps/web is at $version"
              exit 1 ;;
          esac
          # The README shows deploy/compose.yaml, whose default image is the latest minor's.
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *)
              minor=${version%.*}
              grep -qF "\${PINAI_WEB_VERSION:-$minor}" deploy/compose.yaml || {
                echo "::error::set PINAI_WEB_VERSION's default to $minor in deploy/compose.yaml, and copy the file into README.md"
                exit 1
              } ;;
          esac
      # main: edge and sha-<short>. A tag: 0.1.0, 0.1 and latest; a release candidate
      # (v0.2.0-rc.1) only its own version.
      # GitHub detects the license as AGPL-3.0, which can't say "or later": named here.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: org.opencontainers.image.licenses=AGPL-3.0-or-later
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: ${{ github.event_name != 'pull_request' }}
          # Written from main only; pull requests and tags read main's.
          cache-from: type=gha,scope=web
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=web,mode=max' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
