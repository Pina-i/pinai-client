<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Pīna'i — Refined</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<template id="__bundler_thumbnail" data-bg-color="#0b0b0a">
  <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="19" stroke="#c8cfb8" stroke-opacity="0.4" stroke-width="0.5" fill="none"/>
    <path d="M7 28 L15 16 L20 22 L26 13 L33 28 Z" stroke="#c8cfb8" stroke-width="1.1" stroke-linejoin="round" fill="none"/>
    <path d="M22 16 L26 13 L28 16" stroke="#c8cfb8" stroke-width="1.1" stroke-linejoin="round" fill="none"/>
    <circle cx="15.5" cy="11" r="1.1" fill="#e6b672"/>
  </svg>
</template>
<style>
  html,body{margin:0;padding:0;background:#0b0b0a;color:#eae7df;font-family:Geist,ui-sans-serif,system-ui,sans-serif}
  *{box-sizing:border-box}
  @keyframes pn-pulse{0%,100%{transform:scale(1);opacity:0.9}50%{transform:scale(1.06);opacity:0.4}}
  @keyframes pn-blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  @keyframes pn-bounce{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-4px);opacity:1}}
  @keyframes pn-glow{0%,100%{box-shadow:inset 0 0 0 2px var(--voice),0 0 20px -4px var(--voice)}50%{box-shadow:inset 0 0 0 2px var(--voice),0 0 40px -2px var(--voice)}}
  @keyframes pn-wave{0%{transform:scaleY(0.3)}100%{transform:scaleY(1)}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="screens/shell.jsx"></script>
<script type="text/babel" src="screens/signin.jsx"></script>
<script type="text/babel" src="screens/friends.jsx"></script>
<script type="text/babel" src="screens/chat.jsx"></script>
<script type="text/babel" src="screens/voice.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply tokens to :root so everything inherits
  React.useEffect(() => {
    const vars = tokens(t);
    const root = document.documentElement;
    Object.entries(vars).forEach(([k,v]) => root.style.setProperty(k, v));
    root.style.setProperty('--serif', t.serif);
  }, [t]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="intro" title="Pīna'i · v2 proposal"
          subtitle="Editorial dark · Fraunces + Geist · shadcn OKLCH tokens · sage for chat, amber for voice">
          <DCArtboard id="signin" label="01 · Sign-in" width={1200} height={780}>
            <SignInScreen/>
          </DCArtboard>
          <DCArtboard id="friends" label="02 · Friends" width={1200} height={780}>
            <FriendsScreen/>
          </DCArtboard>
        </DCSection>

        <DCSection id="conversation" title="Conversation"
          subtitle="Sage/moss is the chat accent — calm, readable, original-voice.">
          <DCArtboard id="chat" label="03 · Direct message" width={1200} height={780}>
            <ChatScreen/>
          </DCArtboard>
        </DCSection>

        <DCSection id="voice" title="Voice"
          subtitle="Amber/honey is the voice accent — warmer, speaks “live signal”. Distinct from chat at a glance.">
          <DCArtboard id="voice" label="04 · Voice room" width={1200} height={780}>
            <VoiceScreen/>
          </DCArtboard>
        </DCSection>

        <DCSection id="tokens" title="Tokens · shadcn OKLCH"
          subtitle="Drop-in CSS variables. Hue sliders in Tweaks re-tune chat and voice live.">
          <DCArtboard id="tokens" label="05 · Token sheet" width={1200} height={780}>
            <TokenSheet t={t}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Accents"/>
        <TweakSlider label="Chat hue" value={t.chatHue} min={0} max={360} unit="°"
          onChange={v => setTweak('chatHue', v)}/>
        <TweakSlider label="Voice hue" value={t.voiceHue} min={0} max={360} unit="°"
          onChange={v => setTweak('voiceHue', v)}/>
        <TweakSlider label="Chroma" value={t.accentChroma} min={0.02} max={0.14} step={0.005}
          onChange={v => setTweak('accentChroma', v)}/>

        <TweakSection label="Shape"/>
        <TweakSlider label="Corner radius" value={t.radius} min={2} max={18} unit="px"
          onChange={v => setTweak('radius', v)}/>
        <TweakRadio label="Density" value={t.density}
          options={['compact','cozy','airy']}
          onChange={v => setTweak('density', v)}/>

        <TweakSection label="Type"/>
        <TweakSelect label="Serif" value={t.serif}
          options={['Fraunces','Spectral','Instrument Serif']}
          onChange={v => setTweak('serif', v)}/>
      </TweaksPanel>
    </>
  );
}

function TokenSheet({ t }) {
  const vars = tokens(t);
  const groups = [
    ['Surfaces', ['--background','--card','--popover','--muted','--input']],
    ['Text',     ['--foreground','--muted-foreground']],
    ['Border',   ['--border','--border-strong','--ring']],
    ['Chat',     ['--chat','--chat-soft','--chat-ink']],
    ['Voice',    ['--voice','--voice-soft','--voice-ink']],
    ['Semantic', ['--primary','--destructive','--success']],
  ];
  return (
    <Artboard w={1200} h={780} style={{padding:'36px 44px', overflow:'auto'}}>
      <div style={{marginBottom:26}}>
        <Mono style={{fontSize:10, letterSpacing:'0.12em', color:'var(--muted-foreground)', textTransform:'uppercase'}}>— Design tokens</Mono>
        <Serif as="h2" style={{fontSize:34, fontWeight:400, margin:'8px 0 0', letterSpacing:'-0.015em'}}>
          A palette that distinguishes <em style={{color:'var(--chat)', fontStyle:'italic'}}>chat</em> from <em style={{color:'var(--voice)', fontStyle:'italic'}}>voice</em>.
        </Serif>
        <p style={{maxWidth:720, marginTop:12, color:'var(--muted-foreground)', lineHeight:1.55, fontSize:13.5}}>
          Channel semantics are encoded in two siblings — a cooled sage for written conversation, a warm amber for live audio.
          Both share the same lightness and chroma so one never visually shouts over the other; only the hue changes. Everything
          resolves through shadcn-style CSS variables in OKLCH for perceptually even shifts when re-tuning.
        </p>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:22}}>
        {groups.map(([title, keys]) => (
          <div key={title}>
            <Mono style={{fontSize:10, letterSpacing:'0.12em', color:'var(--muted-foreground)', textTransform:'uppercase'}}>{title}</Mono>
            <div style={{marginTop:10, display:'flex', flexDirection:'column', gap:8}}>
              {keys.map(k => <Swatch key={k} name={k} value={vars[k]}/>)}
            </div>
          </div>
        ))}
      </div>

      <div style={{marginTop:28, padding:18, borderRadius:'var(--radius)',
        background:'var(--card)', border:'1px solid var(--border)',
        fontFamily:'JetBrains Mono, monospace', fontSize:11, lineHeight:1.7, color:'var(--muted-foreground)',
        overflow:'auto', maxHeight:180}}>
        <div style={{color:'var(--foreground)', marginBottom:6}}>:root &#123;</div>
        {Object.entries(vars).slice(0,14).map(([k,v]) => (
          <div key={k} style={{paddingLeft:16}}>
            <span style={{color:'var(--chat)'}}>{k}</span>: <span style={{color:'var(--voice)'}}>{v}</span>;
          </div>
        ))}
        <div style={{color:'var(--muted-foreground)', paddingLeft:16}}>/* … */</div>
        <div style={{color:'var(--foreground)'}}>&#125;</div>
      </div>
    </Artboard>
  );
}

function Swatch({ name, value }) {
  return (
    <div style={{display:'flex', alignItems:'center', gap:12, padding:'8px 10px',
      border:'1px solid var(--border)', borderRadius:'var(--radius-sm)', background:'var(--card)'}}>
      <div style={{width:30, height:30, borderRadius:'var(--radius-sm)',
        background:value, border:'1px solid var(--border-strong)', flexShrink:0}}/>
      <div style={{flex:1, minWidth:0}}>
        <Mono style={{fontSize:11.5, color:'var(--foreground)', fontWeight:500}}>{name}</Mono>
        <Mono style={{fontSize:10.5, color:'var(--muted-foreground)', display:'block',
          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{value}</Mono>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
